<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Nota Digital - 60 Cabang</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            font-size: 15px;
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            border-bottom: 1px solid #edf2f7;
            color: #2d3748;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* Tombol WhatsApp Mengirim Link */
        .btn-kirim-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn-kirim-link:hover {
            background-color: #1ebd58;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Data Penjualan Terakhir</h2>

        <table>
            <thead>
                <tr>
                    <th>No. Invoice</th>
                    <th>Nama Customer</th>
                    <th>No. WhatsApp</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>#INV-20260518-01</strong></td>
                    <td>Fushinade</td>
                    <td>085811683696</td>
                    <td>
                        <button onclick="kirimLinkNota('085811683696', 'INV-20260518-01')" class="btn-kirim-link">
                            💬 Kirim Nota via Link
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function kirimLinkNota(nomorCustomer, invoiceId) {
            // 1. Format nomor HP dari 08xxx menjadi 628xxx
            let nomorTarget = nomorCustomer.trim();
            if (nomorTarget.startsWith('0')) {
                nomorTarget = '62' + nomorTarget.slice(1);
            }

            // 2. Buat Link Nota Digital yang mengarah ke website/sistem kamu
            // (Sesuaikan dengan domain web aslimu nanti)
            const linkNotaDigital = `https://vektora-link-hub.netlify.app/nota/view/${invoiceId}`;

            // 3. Susun teks pesan WhatsApp semenarik dan sejelas mungkin
            const teksPesan = `Halo, terima kasih telah berbelanja.\n\nBerikut adalah link nota digital resmi Anda untuk transaksi *#${invoiceId}*.\nSilakan klik link di bawah ini untuk melihat atau mengunduh nota PDF Anda:\n👉 ${linkNotaDigital}\n\nJika ada pertanyaan, silakan balas chat ini ya!`;

            // 4. Encode teks agar aman dikirim lewat URL browser
            const teksEncoded = encodeURIComponent(teksPesan);

            // 5. Satukan nomor tujuan dan teks ke link wa.me resmi
            const urlWhatsApp = `https://wa.me/${nomorTarget}?text=${teksEncoded}`;

            // 6. Buka tab WhatsApp Web/Aplikasi otomatis
            window.open(urlWhatsApp, '_blank');
        }
    </script>

</body>

</html>
