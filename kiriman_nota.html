<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Button</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }

        .wa-button {
            background: #25D366;
            color: white;
            border: none;
            padding: 15px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            text-decoration: none;
        }

        .wa-button:hover {
            background: #128C7E;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <a class="wa-button" id="waBtn">
        &#128172; Hubungi Kami via WhatsApp
    </a>

    <script>
        const nomor = "6285811683696";

        // 😀 = &#128512;
        // 👋 = &#128075;
        // 🔥 = &#128293;

        const pesan = "Halo &#128075; Saya tertarik dengan layanan Anda &#128293;";

        document.getElementById("waBtn").href =
            "https://wa.me/" + nomor + "?text=" + encodeURIComponent(pesan);
    </script>

</body>

</html>
